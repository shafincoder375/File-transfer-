<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>File Share — Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-semibold mb-4">ফাইল আপলোড & শেয়ার লিংক তৈরি করো</h1>

    <label class="block mb-2 text-sm font-medium">আপনার ফাইল সমূহ (multiple)</label>
    <input id="files" type="file" multiple class="block w-full mb-4">

    <div class="mb-4">
      <label class="block text-sm mb-1">Link expiration (optional)</label>
      <select id="expiry" class="border p-2 rounded w-48">
        <option value="0">No expiration</option>
        <option value="1">1 day</option>
        <option value="7" selected>7 days</option>
        <option value="30">30 days</option>
      </select>
      <p class="text-xs text-gray-500 mt-1">(যদি তোমার চান—Firestore doc এ একটি expireAt টাইমস্ট্যাম্প যোগ করা হবে)</p>
    </div>

    <button id="generate" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Generate Link</button>

    <div id="status" class="mt-4"></div>

    <div id="result" class="mt-4 hidden bg-green-50 p-3 rounded">
      <p class="text-sm">Link তৈরি হয়েছে — নিচের লিংকে গিয়ে সব ফাইল preview/ডাউনলোড করতে পারবে:</p>
      <a id="shareLink" class="text-indigo-600 break-all" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script>
    // তোমার দেওয়া config (প্রয়োজন হলে পরিবর্তন করো)
    const firebaseConfig = {
      apiKey: "AIzaSyBVbq8C3OaORt6yU1zWO8E7c3y7Y2VfQOo",
      authDomain: "massage-5800c.firebaseapp.com",
      projectId: "massage-5800c",
      storageBucket: "massage-5800c.firebasestorage.app",
      messagingSenderId: "796344060446",
      appId: "1:796344060446:web:b4514891fc2516513ffc0f",
      measurementId: "G-MVYC8GFX13"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    const filesInput = document.getElementById('files');
    const generateBtn = document.getElementById('generate');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const shareLinkEl = document.getElementById('shareLink');
    const expirySelect = document.getElementById('expiry');

    function humanFileSize(bytes) {
      const units = ['B','KB','MB','GB','TB'];
      let i = 0;
      while(bytes >= 1024 && i < units.length-1) {
        bytes /= 1024;
        i++;
      }
      return bytes.toFixed(2) + ' ' + units[i];
    }

    generateBtn.addEventListener('click', async () => {
      const files = filesInput.files;
      if (!files || files.length === 0) {
        alert('একটা বা একাধিক ফাইল সিলেক্ট করো');
        return;
      }

      generateBtn.disabled = true;
      statusDiv.innerHTML = `<p class="text-sm text-gray-700">Creating share entry...</p>`;

      try {
        // প্রথমে Firestore এ একটি ডকুমেন্ট বানাও (id পেতে)
        const shareDocRef = await db.collection('shares').add({
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          fileCount: files.length,
          // expiry (optional)
          expireAt: null,
        });

        const shareId = shareDocRef.id;
        // যদি expiry নির্বাচন করা থাকে
        const expiryDays = Number(expirySelect.value);
        if (expiryDays > 0) {
          const expireAt = new Date();
          expireAt.setDate(expireAt.getDate() + expiryDays);
          await shareDocRef.update({ expireAt: firebase.firestore.Timestamp.fromDate(expireAt) });
        }

        statusDiv.innerHTML = `<p class="text-sm text-gray-700">Uploading ${files.length} file(s)...</p>`;

        const uploadedFiles = [];
        // আপলোড ফাইলগুলি লুপ করে আপলোড ও ডাউনলোডURL নাও
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const safeName = Date.now() + '_' + f.name.replace(/\s+/g,'_');
          const storagePath = `shares/${shareId}/${safeName}`;
          statusDiv.innerHTML = `<p class="text-sm text-gray-700">Uploading (${i+1}/${files.length}): ${f.name} — ${humanFileSize(f.size)}</p>`;

          const uploadTask = await storage.ref(storagePath).put(f);
          const downloadURL = await uploadTask.ref.getDownloadURL();

          uploadedFiles.push({
            name: f.name,
            size: f.size,
            type: f.type || 'application/octet-stream',
            path: storagePath,
            url: downloadURL,
            uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        // আপডেট Firestore ডকুমেন্টে ফাইল মেটাডাটা যোগ করো
        await shareDocRef.update({
          files: uploadedFiles,
          fileCount: uploadedFiles.length,
        });

        const fullLink = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}view.html?shareId=${shareId}`;
        shareLinkEl.href = fullLink;
        shareLinkEl.textContent = fullLink;
        resultDiv.classList.remove('hidden');
        statusDiv.innerHTML = `<p class="text-sm text-green-700">হোয়ালা! সব আপলোড সম্পন্ন হয়েছে।</p>`;

      } catch (err) {
        console.error(err);
        statusDiv.innerHTML = `<p class="text-sm text-red-600">Error: ${err.message}</p>`;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
