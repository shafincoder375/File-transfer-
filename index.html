<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>File Upload — Free Tier</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6 flex justify-center items-start min-h-screen">
  <div class="w-full max-w-2xl bg-white p-6 rounded shadow">
    <h1 class="text-2xl font-semibold mb-4">ফাইল আপলোড & লিংক তৈরি</h1>
    <input type="file" id="files" multiple class="mb-4 w-full border p-2 rounded">
    <button id="generate" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Generate Link</button>

    <div id="status" class="mt-4 text-sm text-gray-700"></div>
    <div id="result" class="mt-4 hidden bg-green-50 p-3 rounded">
      <p>Link তৈরি হয়েছে:</p>
      <a id="shareLink" class="text-indigo-600 break-all" target="_blank"></a>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBVbq8C3OaORt6yU1zWO8E7c3y7Y2VfQOo",
      authDomain: "massage-5800c.firebaseapp.com",
      projectId: "massage-5800c",
      storageBucket: "massage-5800c.appspot.com",
      messagingSenderId: "796344060446",
      appId: "1:796344060446:web:b4514891fc2516513ffc0f",
      measurementId: "G-MVYC8GFX13"
    };
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();

    const filesInput = document.getElementById('files');
    const generateBtn = document.getElementById('generate');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const shareLinkEl = document.getElementById('shareLink');

    function humanFileSize(bytes){
      const units = ['B','KB','MB','GB','TB'];
      let i=0; while(bytes>=1024 && i<units.length-1){ bytes/=1024; i++; } 
      return bytes.toFixed(2)+' '+units[i];
    }

    generateBtn.addEventListener('click', async () => {
      const files = filesInput.files;
      if(!files || files.length===0){ alert('ফাইল সিলেক্ট করো'); return; }

      generateBtn.disabled = true;
      statusDiv.textContent = `Uploading ${files.length} file(s)...`;

      try {
        // Generate shareId
        const shareId = Date.now().toString(36) + Math.random().toString(36).substring(2,8);

        const uploadPromises = Array.from(files).map(f => new Promise(async (resolve, reject) => {
          const safeName = Date.now()+'_'+f.name.replace(/\s+/g,'_');
          const storageRef = storage.ref(`shares/${shareId}/${safeName}`);
          const uploadTask = storageRef.put(f);

          uploadTask.on('state_changed', snapshot => {
            const percent = (snapshot.bytesTransferred / snapshot.totalBytes)*100;
            statusDiv.textContent = `Uploading ${f.name}: ${percent.toFixed(1)}%`;
          });

          uploadTask.then(async snap => {
            const url = await snap.ref.getDownloadURL();
            resolve({
              name: f.name,
              size: f.size,
              type: f.type || 'application/octet-stream',
              url
            });
          }).catch(err => reject(err));
        }));

        const uploadedFiles = await Promise.all(uploadPromises);

        // Save files.json in same shareId folder
        const jsonRef = storage.ref(`shares/${shareId}/files.json`);
        await jsonRef.putString(JSON.stringify({
          createdAt: new Date().toISOString(),
          files: uploadedFiles
        }));

        // Show link
        const link = `${location.origin}${location.pathname.replace(/[^/]*$/,'')}view.html?shareId=${shareId}`;
        shareLinkEl.href = link;
        shareLinkEl.textContent = link;
        resultDiv.classList.remove('hidden');
        statusDiv.textContent = 'সব ফাইল আপলোড হয়েছে।';

      } catch(err){
        console.error(err);
        statusDiv.textContent = 'Error: '+err.message;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
  </html>
